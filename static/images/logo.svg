<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="medinearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F8C"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#087F8C" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Icon Symbol: Location Pin with Embedded Medical Pulse Cross -->
  <g transform="translate(4, 4)">
    <rect width="54" height="54" rx="14" fill="url(#medinearGrad)" filter="url(#softShadow)"/>
    <!-- Medical Cross with heartbeat center line -->
    <path d="M27 15 V39 M15 27 H39" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="27" cy="27" r="4.5" fill="#E6F7F8" stroke="#087F8C" stroke-width="1.5"/>
    <!-- Radar / Near pulse dot -->
    <circle cx="39" cy="15" r="3.5" fill="#10B981"/>
  </g>
  <!-- Text Brand -->
  <text x="68" y="35" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="24" fill="#193047" letter-spacing="-0.5">
    MediNear<tspan fill="#087F8C">.</tspan><tspan fill="#2563EB" font-weight="700">AI</tspan>
  </text>
  <text x="69" y="49" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#64748B" letter-spacing="1.2">
    SMART HEALTHCARE FINDER
  </text>
</svg>
